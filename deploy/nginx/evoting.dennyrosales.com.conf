# eVoting — reverse proxy con HTTPS (Let's Encrypt)
# Destino: / → Next.js :3001 | /api y /health* → FastAPI :8000
#
# IMPORTANTE:
# - NO copies este archivo sobre album.dennyrosales.com ni sobre default.
# - Solo sobre: /etc/nginx/sites-available/evoting.dennyrosales.com.conf
# - Los certificados suelen seguir en /etc/letsencrypt/live/evoting.dennyrosales.com/
#
# Instalación segura:
#   sudo cp deploy/nginx/evoting.dennyrosales.com.conf \
#     /etc/nginx/sites-available/evoting.dennyrosales.com.conf
#   sudo ln -sf /etc/nginx/sites-available/evoting.dennyrosales.com.conf \
#     /etc/nginx/sites-enabled/evoting.dennyrosales.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream evoting_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream evoting_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name evoting.dennyrosales.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evoting.dennyrosales.com;

    # Certificados Let's Encrypt (si el path difiere, ajusta tras: sudo ls /etc/letsencrypt/live/)
    ssl_certificate     /etc/letsencrypt/live/evoting.dennyrosales.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evoting.dennyrosales.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://evoting_api;
    }

    location ^~ /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://evoting_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://evoting_web;
    }
}
