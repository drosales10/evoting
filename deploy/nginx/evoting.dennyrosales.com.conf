# eVoting — reverse proxy (HTTP; Certbot añadirá el bloque SSL)
# Destino: / → Next.js :3001 | /api y /health → FastAPI :8000
# (3001 evita choque con otras apps del droplet en :3000)
#
# Instalación:
#   sudo cp deploy/nginx/evoting.dennyrosales.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/evoting.dennyrosales.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d evoting.dennyrosales.com

upstream evoting_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream evoting_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name evoting.dennyrosales.com;

    client_max_body_size 25m;

    # API FastAPI (rutas /api/v1/... y cookies en /api/v1/auth)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://evoting_api;
    }

    # Healthchecks (fuera de /api)
    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://evoting_api;
    }

    location = /health/ready {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://evoting_api;
    }

    # Frontend Next.js
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://evoting_web;
    }
}
